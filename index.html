<!DOCTYPE html>
<html>

<body>

<h2>SAGE TXT Transfer</h2>

<button onclick="connectBLE()">Connect ESP32</button>

<button onclick="sendTXT()">Send zones.txt</button>

<pre id="status"></pre>

<script>

let characteristic;

function log(msg) {
  document.getElementById("status").textContent += msg + "\n";
}

async function connectBLE() {

  const device = await navigator.bluetooth.requestDevice({
    filters: [{ name: 'SAGE_ESP32' }],
    optionalServices: ['12345678-1234-1234-1234-1234567890ab']
  });

  const server = await device.gatt.connect();

  const service = await server.getPrimaryService(
    '12345678-1234-1234-1234-1234567890ab'
  );

  characteristic = await service.getCharacteristic(
    'abcd1234-5678-1234-5678-abcdef123456'
  );

  log("ESP32 Connected");
}

async function sendTXT() {

  log("Fetching zones.txt...");

  const response = await fetch(
    "https://gist.githubusercontent.com/Raghuvardhan-20/48c8135cd8e0394c18cafe8823925959/raw/2c4440f1da4a1a8f1dbb95ee23c6026006fca0ed/zones.txt"
  );

  const text = await response.text();

  log("File Size: " + text.length + " bytes");

  const chunkSize = 100;

  for (let i = 0; i < text.length; i += chunkSize) {

    const chunk = text.substring(i, i + chunkSize);

    const encoder = new TextEncoder();

    await characteristic.writeValue(
      encoder.encode(chunk)
    );

    log("Chunk Sent: " + (i / chunkSize + 1));

    await new Promise(resolve => setTimeout(resolve, 50));
  }

  // END SIGNAL
  const encoder = new TextEncoder();

  await characteristic.writeValue(
    encoder.encode("END_FILE")
  );

  log("Transfer Complete");
}

</script>

</body>

</html>
