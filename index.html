<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SAGE GeoJSON BLE Transfer</title>
</head>

<body>

<h2>SAGE GeoJSON → ESP32</h2>

<button onclick="connectBLE()">Connect ESP32</button>
<button onclick="convertAndSend()">Convert & Send</button>

<pre id="status"></pre>

<script>

let characteristic;

const TYPE_MAP = {
    school: "S",
    hospital: "H",
    clinic: "H",
    college: "C",
    university: "U",
    general: "G"
};

function log(msg) {
    document.getElementById("status").textContent += msg + "\n";
}

async function connectBLE() {

    const device = await navigator.bluetooth.requestDevice({
        filters: [{ name: "SAGE_ESP32" }],
        optionalServices: [
            "12345678-1234-1234-1234-1234567890ab"
        ]
    });

    const server = await device.gatt.connect();

    const service = await server.getPrimaryService(
        "12345678-1234-1234-1234-1234567890ab"
    );

    characteristic = await service.getCharacteristic(
        "abcd1234-5678-1234-5678-abcdef123456"
    );

    log("ESP32 Connected");
}

function geojsonToTxt(geojson) {

    let output = "";

    let zones = 0;
    let points = 0;

    for (const feature of geojson.features) {

        const props = feature.properties || {};
        const geometry = feature.geometry || {};

        if (geometry.type !== "Polygon")
            continue;

        const zoneType =
            (props.type || "general").toLowerCase();

        const shortType =
            TYPE_MAP[zoneType] || "G";

        const speedLimit =
            parseInt(props.limit || 40);

        let coords =
            [...geometry.coordinates[0]];

        if (
            coords.length > 1 &&
            coords[0][0] === coords[coords.length - 1][0] &&
            coords[0][1] === coords[coords.length - 1][1]
        ) {
            coords.pop();
        }

        output +=
            `${shortType},${speedLimit},${coords.length}\n`;

        for (const point of coords) {

            const lon =
                Number(point[0]).toFixed(5);

            const lat =
                Number(point[1]).toFixed(5);

            output += `${lon},${lat}\n`;

            points++;
        }

        output += "\n";

        zones++;
    }

    log("Zones: " + zones);
    log("Points: " + points);

    return output;
}

async function sendText(text) {

    if (!characteristic) {
        alert("Connect ESP32 first");
        return;
    }

    const encoder = new TextEncoder();

    const chunkSize = 100;

    log("Sending...");

    for (let i = 0; i < text.length; i += chunkSize) {

        const chunk =
            text.substring(i, i + chunkSize);

        await characteristic.writeValue(
            encoder.encode(chunk)
        );

        log(
            "Chunk " +
            (Math.floor(i / chunkSize) + 1)
        );

        await new Promise(resolve =>
            setTimeout(resolve, 50)
        );
    }

    await characteristic.writeValue(
        encoder.encode("END_FILE")
    );

    log("Transfer Complete");
}

async function convertAndSend() {

    try {

        log("Loading zones.geojson...");

        const response =
            await fetch("zones.geojson");

        const geojson =
            await response.json();

        log("Converting...");

        const txtData =
            geojsonToTxt(geojson);

        log(
            "TXT Size: " +
            txtData.length +
            " bytes"
        );

        await sendText(txtData);

    } catch (err) {

        log("ERROR: " + err);
    }
}

</script>

</body>
</html>
